name: CI Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build
        run: |
          echo "Building..."
          docker build -t myapp:${{ github.run_number }} .
      
      - name: Test
        run: |
          echo "Testing..."
          docker run --rm myapp:${{ github.run_number }} echo "Tests passed!"

  trigger-jenkins:
    runs-on: self-hosted
    needs: build  # Runs after build succeeds
    
    steps:
      - name: Trigger Jenkins Job
        run: |
          curl -X POST "https://${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB }}/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --insecure
